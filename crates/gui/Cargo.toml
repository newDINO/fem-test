[package]
name = "fem-gui"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "fem-gui"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "system_fonts", "wgpu", "x11", "wayland"] }
fem-solver = { path = "../solver" }
bytemuck = { version = "1", features = ["derive"] }

[dev-dependencies]
egui_system_font_provider = "0.37"
