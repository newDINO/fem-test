[package]
name = "fem-gui"
version = "0.1.0"
edition = "2024"

[lib]
name = "fem_gui"
path = "src/lib.rs"

[[bin]]
name = "fem-gui"
path = "src/main.rs"

[dependencies]
fem-import = { path = "../import" }
fem-solver = { path = "../solver" }
fem-types = { path = "../types" }
bytemuck = { version = "1", features = ["derive"] }

[target.'cfg(not(target_family = "wasm"))'.dependencies]
eframe = { version = "0.37", default-features = false, features = [
    "default_fonts",
    "system_fonts",
    "wgpu",
    "x11",
    "wayland",
    "clipboard",
] }
rfd = "0.18"

[target.'cfg(target_family = "wasm")'.dependencies]
eframe = { version = "0.37", default-features = false, features = [
    "default_fonts",
    "wgpu",
] }
rfd = { version = "0.18", default-features = false }
