[package]
name = "fem-web"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[target.'cfg(target_family = "wasm")'.dependencies]
eframe = { version = "0.37", default-features = false, features = [
    "default_fonts",
    "wgpu",
] }
fem-gui = { path = "../gui" }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
    "Document",
    "Element",
    "HtmlCanvasElement",
    "Window",
] }
console_error_panic_hook = "0.1"
log = "0.4"

[package.metadata.wasm-pack.profile.release]
# Do not download binaryen/wasm-opt; the release wasm is already much smaller
# than a debug build, and `--no-opt` in build.sh makes the intent explicit.
wasm-opt = false
